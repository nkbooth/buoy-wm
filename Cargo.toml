#
# Story 2.2 Task 2: workspace root manifest, added when `buoy-tag-picker` became
# the first second Cargo target. `wm/` remains a normal member manifest
# (no `[workspace]` table of its own); Story 2.1's Technical notes deferred
# exactly this conversion to "whichever future story first adds
# `buoy-tag-picker`/`buoy-status-bar` as actual separate Cargo targets."

[workspace]
resolver = "2"
members = ["buoy-common", "wm", "buoy-tag-picker", "buoy-status-bar"]

# Shared package metadata. Every member inherits these with
# `field.workspace = true`, so the license, MSRV and repository URL can
# never drift apart between the three published crates.
[workspace.package]
version = "0.1.0"
edition = "2024"
# Let chains (`if let … && …`) stabilised in Rust 1.88, on top of the
# edition 2024 they require.
rust-version = "1.88"
authors = ["Nick Booth <n1cck@onlyhams.radio>"]
license = "RPL-1.5"
repository = "https://github.com/nkbooth/buoy-wm"
homepage = "https://github.com/nkbooth/buoy-wm"
keywords = ["wayland", "river", "window-manager", "tiling", "compositor"]
categories = ["command-line-utilities", "gui"]


# Release builds are what `scripts/install.sh` copies into
# `~/.local/lib/buoy-wm`, where they run as a long-lived session process
# rather than a short-lived command — extra link-time work is paid once at
# build and recovered over the whole login session.
# `buoy-common` is declared here rather than per member so its version
# requirement exists in exactly one place. The version is not decoration:
# `deny.toml` sets `wildcards = "deny"`, and a bare `{ path = ... }` with no
# version requirement is a wildcard, which fails CI's `cargo deny` job.
[workspace.dependencies]
buoy-common = { path = "buoy-common", version = "0.1.0" }
# `wm` dev-depends on both satellites so one test can drive `protocol`'s
# types against the two hand-written mirrors of them and fail when either
# side drifts (audit finding J-01). Not a runtime dependency in either
# direction — the satellites do not depend on `wm` at all, which is what
# makes this a dev-dependency rather than a cycle. Versioned for the same
# reason `buoy-common` is: `deny.toml` sets `wildcards = "deny"`.
buoy-status-bar = { path = "buoy-status-bar", version = "0.1.0" }
buoy-tag-picker = { path = "buoy-tag-picker", version = "0.1.0" }


# Comments in this codebase reference identifiers in backticks constantly,
# and a rename leaves every one of them pointing at nothing with no tool
# noticing — ten such references had accumulated by the time an audit
# counted them (finding J-07). `rustdoc` can only see `///`, so this makes
# the doc-comment half of that index checkable: a `[`Foo::bar`]` link that
# stops resolving is a CI failure, which is the only version of this rule
# that cannot rot.
# Size and complexity, none of which clippy enables by default:
# `too_many_lines` and `cognitive_complexity` are pedantic/nursery, and the
# other two only fire past a threshold `clippy.toml` tightens. Without them
# nothing in this pipeline flagged a 365-line function at nesting depth 9
# (audit findings J-04, T-06) — a review-only rule that had already been
# broken once and could not detect itself.
#
# `warn`, not `deny`: CI and pre-commit both run clippy with `-D warnings`,
# so these fail the build there while a local `cargo build` stays workable.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"


[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
redundant_explicit_links = "deny"
# `cargo doc` here is always `--document-private-items` (see `ci.yml`),
# because almost every decision in these crates is made by a private
# function and the default would check nearly none of the doc comments.
# Under that flag a link from a public item to a private one resolves and is
# checked — which is the whole point — so rustdoc's advisory that it "will
# break without `--document-private-items`" is describing a build this
# project does not do. Allowed workspace-wide rather than per site: seven
# such links existed the moment the `[lib]` targets made anything public at
# all (audit finding T-04), and they are all the same intended shape.
private_intra_doc_links = "allow"


[profile.release]
lto = "thin"
strip = true
