#
# Story 2.2 Task 2: workspace root manifest, added when `buoy-tag-picker` became
# the first second Cargo target. `wm/` remains a normal member manifest
# (no `[workspace]` table of its own); Story 2.1's Technical notes deferred
# exactly this conversion to "whichever future story first adds
# `buoy-tag-picker`/`buoy-status-bar` as actual separate Cargo targets."

[workspace]
resolver = "2"
members = ["wm", "buoy-tag-picker", "buoy-status-bar"]

# Shared package metadata. Every member inherits these with
# `field.workspace = true`, so the license, MSRV and repository URL can
# never drift apart between the three published crates.
[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 stabilised in Rust 1.85; nothing here needs anything newer.
rust-version = "1.85"
authors = ["Nick Booth <n1cck@onlyhams.radio>"]
license = "RPL-1.5"
repository = "https://github.com/nkbooth/buoy-wm"
homepage = "https://github.com/nkbooth/buoy-wm"
keywords = ["wayland", "river", "window-manager", "tiling", "compositor"]
categories = ["command-line-utilities", "gui"]


# Release builds are what `scripts/install.sh` copies into
# `~/.local/lib/buoy-wm`, where they run as a long-lived session process
# rather than a short-lived command — extra link-time work is paid once at
# build and recovered over the whole login session.
[profile.release]
lto = "thin"
strip = true
