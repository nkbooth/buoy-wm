# Thresholds for the size and complexity lints declared in
# `[workspace.lints.clippy]`. They exist because clippy's *default* set
# contains no size or complexity lint at all, so nothing in this pipeline
# would have flagged a 365-line function at cyclomatic complexity ~53 and
# nesting depth 9 — which is exactly what `Seat::do_action` was until an
# audit counted it by hand (findings J-04, T-06).
#
# Both are tighter than clippy's defaults (25 and 7). The numbers are not
# claims about an ideal; they are set just below what this codebase already
# achieves everywhere but the three `#[allow]`ed sites, so the gate holds
# the line rather than inviting a new one.
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 6
