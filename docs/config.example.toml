# buoy-wm example configuration.
#
# Copy to ~/.config/buoy/config.toml. Every section is optional — with no
# config file at all, buoy-wm uses exactly the defaults shown here.

[defaults]
# Spawned by the `terminal` action, and used for each tag's pinned terminal.
terminal = "foot"
# Spawned by the `launcher` action, and only that. `fuzzel` stays hardcoded
# where it is driven as a menu rather than a launcher — the tag pickers and
# the `hotkeys` cheat-sheet — since those pass fuzzel-specific flags.
launcher = "fuzzel"
# The tag created and shown at login when no tag exists yet.
default_tag = "default"
# Argv passed to `terminal` to spawn a tag's pinned terminal. `{app_id}` is
# required — it is how the WM recognizes that window — and `{session}` is
# replaced with the tag's zellij session name. The default is foot's
# spelling; most other terminals use `--class` instead of `-a`, e.g.
#   pinned_terminal_args = ["--class", "{app_id}", "-e", "zellij", "attach", "--create", "{session}"]
pinned_terminal_args = ["-a", "{app_id}", "zellij", "attach", "--create", "{session}"]

# --- Keybinds ---------------------------------------------------------------
#
# Declaring ANY [[keybind]] replaces the entire built-in set, so list every
# binding you want. Mousebinds are a separate list with the same rule.
#
#   mod    = any of "Super" ("Mod4"), "Ctrl" ("Control"), "Alt" ("Mod1"),
#            "Shift". Optional — omit it for an unmodified key.
#   key    = a keysym name: a single character ("a", "1", "?"), a named key
#            ("Return", "Space", "Tab", "Escape", "Left", "Page_Up"), or a
#            function key ("F1".."F35"). Named keys are case-insensitive;
#            single characters are NOT — "a" and "A" are different keysyms,
#            and an uppercase letter is the *shifted* symbol, so it must be
#            bound with "Shift" or it can never fire. Write "q", not "Q",
#            for Super+q. (This is validated at load.)
#   action = a bare string, or a single-key table for the two that take an
#            argument.
#
# Actions: terminal, launcher, close, focus_next, exit, cycle_tag,
#          tag_picker, tag_switch, hotkeys,
#          { switch_tag = "<name>" }, { exec = "<command line>" }
# `move` and `resize` drive a pointer drag, so they are mousebind-only.
#
# Binding the same mod+key twice is an error rather than a silent race.

[[keybind]]
mod = ["Super"]
key = "Space"
action = "terminal"

[[keybind]]
mod = ["Super"]
key = "r"
action = "launcher"

[[keybind]]
mod = ["Super"]
key = "q"
action = "close"

[[keybind]]
mod = ["Super"]
key = "n"
action = "focus_next"

[[keybind]]
mod = ["Super"]
key = "Tab"
action = "cycle_tag"

[[keybind]]
mod = ["Super"]
key = "a"
action = "tag_picker"

[[keybind]]
mod = ["Super"]
key = "s"
action = "tag_switch"

[[keybind]]
mod = ["Super", "Shift"]
key = "?"
action = "hotkeys"

[[keybind]]
mod = ["Super"]
key = "Escape"
action = "exit"

# Named tags. The tag is created the first time the bind is pressed, so
# these work on a fresh session with no setup.

[[keybind]]
mod = ["Super"]
key = "1"
action = { switch_tag = "email" }

[[keybind]]
mod = ["Super"]
key = "2"
action = { switch_tag = "misc" }

# Arbitrary commands. Run through `sh -c`, so pipes, arguments and `~` all
# work as they would in a shell.

[[keybind]]
mod = ["Super"]
key = "p"
action = { exec = "grim -g \"$(slurp)\" ~/screenshot.png" }

[[keybind]]
mod = ["Super", "Shift"]
key = "B"
action = { exec = "~/bin/toggle-bluetooth.sh" }

# --- Mousebinds -------------------------------------------------------------
#
# button = "Left", "Right" or "Middle"

[[mousebind]]
mod = ["Super"]
button = "Left"
action = "move"

[[mousebind]]
mod = ["Super"]
button = "Right"
action = "resize"

# --- Input devices ----------------------------------------------------------
#
# Each [[input]] block configures every libinput device whose name matches
# `name`. Find the names with `libinput list-devices` (needs root), or read
# them out of `/proc/bus/input/devices`.
#
#   name  = a pattern matched against the device name. `*` matches any run of
#           characters and is the ONLY wildcard — `?` and `[...]` are literal.
#           Case-sensitive. Matched top to bottom, first match wins, so put
#           specific devices above a catch-all `name = "*"`.
#
# Every setting below is optional, and OMITTING one is not the same as setting
# it to false: an omitted setting sends no request at all, leaving libinput's
# own default in place, while `tap = false` actively disables tap. That is why
# there is no way to write "leave this alone" explicitly — just don't list it.
#
# As with [[keybind]]/[[mousebind]], declaring ANY [[input]] replaces the
# whole built-in list. The only built-in entry is the touchpad one below, so
# if you add a block for some other device, restate `tap = true` here too or
# your touchpad silently loses tap-to-click.
#
# Rejected at load (rather than looking configured and doing nothing):
# an empty `name`, a block that sets nothing, a repeated `name`, and an
# `accel_speed` outside -1.0..=1.0.

# The built-in default, written out explicitly. libinput ships tap-to-click
# DISABLED on any device that has physical buttons, which is every laptop
# clickpad — without this, the touchpad moves the cursor and scrolls but
# taps do nothing at all.
[[input]]
name = "*Touchpad*"
# Tap-to-click. With `tap_button_map = "lrm"` (libinput's default) one finger
# is left click, two fingers right click, three middle. Tap-and-drag and
# double-tap come along with it — they are the same libinput feature.
tap = true
# "lrm" = 1/2/3 fingers -> left/right/middle. "lmr" = left/middle/right.
# tap_button_map = "lrm"
# How a PHYSICAL press resolves to a button, independent of tap:
#   "button_areas" — the bottom of the pad is split into left/right zones
#   "clickfinger"  — the finger count decides, anywhere on the pad
#   "none"         — no physical click buttons
# Leave unset to keep whatever the device defaults to; the WM logs the
# current method at startup for any device configured here.
# click_method = "button_areas"
# natural_scroll = true
# libinput calls this "dwt": ignore the touchpad briefly while typing.
# disable_while_typing = true
# Pointer acceleration, -1.0 (slowest) to 1.0 (fastest). 0.0 is the device
# default, not "no acceleration".
# accel_speed = 0.3

# Other devices are left entirely alone unless you name them. Uncommenting
# this would ALSO mean restating the touchpad block above, since any
# [[input]] replaces the built-in list.
#
# [[input]]
# name = "*Logitech*"
# natural_scroll = false
# accel_speed = 0.0
