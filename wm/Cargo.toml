[package]
name = "buoy-wm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The window manager itself: owns all tag state and speaks river-window-management-v1."
readme = "README.md"

[dependencies]
buoy-common.workspace = true
bitflags = "2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
wayland-backend = "0.3.14"
wayland-client = "0.31.13"
wayland-scanner = "0.31.9"

[lints]
workspace = true
