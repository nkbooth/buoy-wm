#
# Portal backend routing for the packaged buoy session. xdg-desktop-portal
# picks this file up as <desktop>-portals.conf because buoy.desktop sets
# DesktopNames=buoy, which GDM exports as XDG_CURRENT_DESKTOP. Nothing
# else routes screen capture for "buoy": the wlroots backend's legacy
# UseIn= list does not name it, and the last-resort gtk backend does not
# implement ScreenCast or Screenshot at all.
#
# ScreenCast and Screenshot go to wlr (xdg-desktop-portal-wlr), the only
# backend that implements them on a wlroots compositor; river already
# provides the capture protocols it needs. Everything else falls to gtk,
# which covers the file chooser, notifications, settings and the rest.
# Interfaces with no wlroots or gtk backend (GlobalShortcuts,
# InputCapture) are simply left unlisted and end up unavailable.
#
# Never append `none` to a list: xdg-desktop-portal (1.22.1) checks each
# list for `none` before trying any backend ahead of it, so `wlr;none`
# switches the interface off, and it only says so at debug level.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
