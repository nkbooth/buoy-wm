# Runs in-container only (pre-commit run --all-files, via
# `devpod ssh buoy-wm`). Deliberately NOT `pre-commit install`ed: commits
# happen on the host, where neither the pre-commit binary nor a cargo
# toolchain exist, so the git-hook shim would fail closed.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        language: system
        entry: cargo fmt --all -- --check
        # Manifest/lockfile changes (e.g. a dependency bump) can change what
        # clippy lints or how fmt formats generated-adjacent code, so they
        # need the same gate as source changes, not just *.rs.
        #
        # This alternation must name every workspace member: a change
        # confined to a member missing from it skips both hooks locally and
        # is only caught in CI, which runs `--workspace` unconditionally.
        # It has already fallen behind twice — once at `buoy-status-bar`,
        # once at `buoy-common` — so treat adding a member here as part of
        # adding a member at all.
        files: ^(buoy-common|wm|buoy-tag-picker|buoy-status-bar)/(src/.*\.rs|Cargo\.toml)$|^Cargo\.(toml|lock)$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --workspace --all-targets -- -D warnings
        files: ^(buoy-common|wm|buoy-tag-picker|buoy-status-bar)/(src/.*\.rs|Cargo\.toml)$|^Cargo\.(toml|lock)$
        pass_filenames: false
      # RPL 1.5 §6.4(a) requires the notice in every source file, so the
      # 16-line block is replicated deliberately and must not be
      # deduplicated (ADR-009). A new file that forgot it is the failure
      # mode a hook can actually catch. `wm/protocol/*.xml` is excluded:
      # vendored MIT third-party, see NOTICE.md.
      - id: licence-header
        name: RPL-1.5 licence header present
        language: system
        entry: scripts/check-licence-header.sh
        files: \.(rs|toml|ya?ml|sh|json|rb|spec)$
        exclude: ^wm/protocol/
  # Purely preventive — nothing is leaking today. CI's `hygiene` job runs
  # this same pinned revision so there is one version of the check rather
  # than two that drift.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
