# Runs in-container only (pre-commit run --all-files, via
# `devpod ssh buoy-wm`). Deliberately NOT `pre-commit install`ed: commits
# happen on the host, where neither the pre-commit binary nor a cargo
# toolchain exist, so the git-hook shim would fail closed.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        language: system
        entry: cargo fmt --all -- --check
        # Manifest/lockfile changes (e.g. a dependency bump) can change what
        # clippy lints or how fmt formats generated-adjacent code, so they
        # need the same gate as source changes, not just *.rs. Story 2.2's
        # own comment here claimed this was already "widened workspace-wide
        # to cover either member," but the regex was still a hardcoded
        # two-name alternation — a `buoy-status-bar`-only change (Story 2.5)
        # would have silently skipped both hooks locally. Story 2.5 Task 7:
        # widened to all three current members. Not written as a fully
        # member-name-agnostic glob (e.g. matching any top-level directory
        # with a `src/*.rs`/`Cargo.toml`) on purpose: this project's own
        # three-strike-DRY posture (see `buoy-status-bar/src/wire.rs`'s module
        # doc comment) already established that this is the last story in
        # the entire currently planned project, so there is no future
        # fourth member this hardcoding could ever fall behind again — a
        # more "future-proof" glob would just be unused generality for an
        # audience of zero remaining members.
        files: ^(wm|buoy-tag-picker|buoy-status-bar)/(src/.*\.rs|Cargo\.toml)$|^Cargo\.(toml|lock)$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --workspace --all-targets -- -D warnings
        files: ^(wm|buoy-tag-picker|buoy-status-bar)/(src/.*\.rs|Cargo\.toml)$|^Cargo\.(toml|lock)$
        pass_filenames: false
      # RPL 1.5 §6.4(a) requires the notice in every source file, so the
      # 16-line block is replicated deliberately and must not be
      # deduplicated. A new file that forgot it is the failure mode a hook
      # can actually catch. `wm/protocol/*.xml` is excluded: vendored MIT
      # third-party, see NOTICE.md.
      - id: licence-header
        name: RPL-1.5 licence header present
        language: system
        entry: scripts/check-licence-header.sh
        files: \.(rs|toml|ya?ml|sh|json|rb|spec)$
        exclude: ^wm/protocol/
  # Purely preventive — nothing is leaking today. CI's `hygiene` job runs
  # this same pinned revision so there is one version of the check rather
  # than two that drift.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
