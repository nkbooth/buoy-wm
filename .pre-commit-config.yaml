# Runs in-container only (pre-commit run --all-files, via
# `devpod ssh buoy-wm`). Deliberately NOT `pre-commit install`ed: commits
# happen on the host, where neither the pre-commit binary nor a cargo
# toolchain exist, so the git-hook shim would fail closed.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        language: system
        entry: cargo fmt --all -- --check
        # Manifest/lockfile changes (e.g. a dependency bump) can change what
        # clippy lints or how fmt formats generated-adjacent code, so they
        # need the same gate as source changes, not just *.rs. `clippy.toml`
        # is in for the same reason, only more directly: it is where the
        # complexity thresholds live.
        #
        # This alternation must name every workspace member: a change
        # confined to a member missing from it skips all three hooks locally
        # and is only caught in CI, which runs `--workspace`
        # unconditionally. It has already fallen behind twice — once at
        # `buoy-status-bar`, once at `buoy-common` — so treat adding a
        # member here as part of adding a member at all. `tests/` is in the
        # path alternation for the same reason: the integration tier added
        # by audit finding T-04 lives there, not under `src/`, so a change
        # confined to it would otherwise run no gate at all locally.
        files: ^(buoy-common|wm|buoy-tag-picker|buoy-status-bar)/((src|tests)/.*\.rs|Cargo\.toml)$|^(Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --workspace --all-targets -- -D warnings
        files: ^(buoy-common|wm|buoy-tag-picker|buoy-status-bar)/((src|tests)/.*\.rs|Cargo\.toml)$|^(Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
      # The whole suite runs in well under a second, and this is a
      # test-first project whose gate for "done" is that the tests pass —
      # leaving it to CI meant the one check the workflow is built around
      # was the one check a local commit skipped (audit finding T-06).
      - id: cargo-test
        name: cargo test
        language: system
        entry: cargo test --workspace --locked
        files: ^(buoy-common|wm|buoy-tag-picker|buoy-status-bar)/((src|tests)/.*\.rs|Cargo\.toml)$|^(Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
      # RPL 1.5 §6.4(a) requires the notice in every source file, so the
      # 16-line block is replicated deliberately and must not be
      # deduplicated (ADR-009). A new file that forgot it is the failure
      # mode a hook can actually catch. `wm/protocol/*.xml` is excluded:
      # vendored MIT third-party, see NOTICE.md.
      - id: licence-header
        name: RPL-1.5 licence header present
        language: system
        entry: scripts/check-licence-header.sh
        files: \.(rs|toml|ya?ml|sh|json|rb|spec)$
        exclude: ^wm/protocol/
  # Purely preventive — nothing is leaking today. CI's `hygiene` job runs
  # this same pinned revision so there is one version of the check rather
  # than two that drift.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
