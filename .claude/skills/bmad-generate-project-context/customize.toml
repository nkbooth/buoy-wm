[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All artifacts must follow org naming conventions."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "The generated project-context.md MUST include the following standing rules as non-negotiable AI dev agent constraints: (1) TDD required — write failing tests before any implementation; tests must pass before tasks close. (2) All implementation runs inside devcontainer via devpod; never install toolchains or run builds/tests on the host. (3) Run 'pre-commit install' inside the devcontainer before the first commit. (4) Git commits focus on WHY not WHAT; never add Co-Authored-By AI trailers. (5) Taskwarrior is the source of truth for task tracking — check and update task status as work progresses. (6) Language stack is constrained to: Rust (compiled/binary/performance), Python (scripts/service APIs/iteration speed), Bash (glue/CI/automation), C#/.NET (Windows-adjacent/enterprise), TypeScript+React (frontend SPA only, Vite build tool). Do not suggest Go, Java, PHP, or Ruby. (7) Package managers: uv for Python, native cargo for Rust, dotnet SDK for C#, npm for TypeScript. (8) Public API functions and methods get docstrings/doc comments; private internals do not. (9) Errors propagate up — never swallowed silently, no logging-and-continuing for errors that should stop execution. (10) Secrets are managed via 1Password CLI (op): commit .env.template with op://project-name/ITEM_NAME/credential URIs (never commit a .env); run commands that need env secrets via 'op run --env-file .env.template -- <command>' inside the devcontainer; op CLI is installed in the devcontainer; CI uses 1password/load-secrets-action@v2 with OP_SERVICE_ACCOUNT_TOKEN as the one allowed raw CI secret (mark unimplemented wiring with '# TODO(1password): create service account and set OP_SERVICE_ACCOUNT_TOKEN'); gitleaks runs in pre-commit to block accidental secret commits.",
]

# Scalar: executed when the workflow reaches Step 3 (Context Completion & Finalization),
