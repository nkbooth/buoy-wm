# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-check-implementation-readiness. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All artifacts must follow org naming conventions."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "Implementation readiness MUST include these additional checks beyond the standard BMAD checklist: (1) devcontainer present (.devcontainer/devcontainer.json exists, specifies a base image appropriate for the stack, and installs the op CLI). (2) CI workflow present (.github/workflows/ci.yml or .forgejo/workflows/ci.yml) with lint, test, and build steps. (3) pre-commit config present (.pre-commit-config.yaml) with hooks appropriate for the stack. (4) Test framework identified in the architecture and referenced in at least Epic 1's stories. (5) TDD task structure: every story's tasks begin with RED phase (failing tests) before GREEN phase (implementation). (6) Secrets infrastructure: .env.template committed with op://project-name/ URIs; .env present in .gitignore; gitleaks hook in .pre-commit-config.yaml. (7) CI secret wiring: CI workflow either has '# TODO(1password):' marker OR has 1password/load-secrets-action@v2 wired — no plaintext secrets or raw GH-native secret references as final approach.",
  "Flag readiness as BLOCKED (not just warned) if any of the following are missing: devcontainer, CI workflow, .env.template, or gitleaks in pre-commit — these are non-negotiable for implementation to begin.",
]

# Scalar: executed when the workflow reaches Step 6 (Final Assessment),
# after the readiness report has been saved and presented. Override wins.
# Leave empty for no custom post-completion behavior.

on_complete = ""
