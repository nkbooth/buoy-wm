# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-dev-story. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = [
  "Run `timew summary :day` via Bash and display today's Timewarrior time log as context before beginning story work.",
]

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = [
  "Run `task project:{project_name} +story list` via Bash and display the results as the Taskwarrior sprint view — this is the source of truth for story status.",
]

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All stories must include testable acceptance criteria."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "Taskwarrior is the source of truth for story tracking. At workflow step 4 when the story is marked in-progress: (1) run `task project:{project_name} +story description.contains:{{story_key}} _uuid` via Bash to get the UUID; (2) run `task <uuid> modify -bmad_ready +bmad_active` via Bash; (3) run `task <uuid> start` via Bash (this also starts Timewarrior tracking). If no task exists yet, first create it: `task add project:{project_name} +story +bmad_active '{{story_key}}'` via Bash, then start it.",
  "At workflow step 9 when the story moves to 'review': run `task project:{project_name} +story description.contains:{{story_key}} _uuid` via Bash, then `task <uuid> stop` (ends Timewarrior) and `task <uuid> modify -bmad_active +bmad_review` via Bash.",
  "Secrets in story implementation: if this story requires environment secrets, run all commands via 'op run --env-file .env.template -- <command>' inside the devcontainer. If a new secret is needed, add it to .env.template with an op://project-name/ITEM_NAME/credential URI before writing code that uses it — never hardcode credentials or create a committed .env.",
]

# Scalar: executed when the workflow reaches its final step,
# after the story implementation is complete and status is updated. Override wins.
# Leave empty for no custom post-completion behavior.

on_complete = "Ensure Timewarrior tracking is stopped: run `task project:{project_name} +bmad_active +story stop` via Bash (safe even if no active task). Display `timew summary :day` to show today's totals."
