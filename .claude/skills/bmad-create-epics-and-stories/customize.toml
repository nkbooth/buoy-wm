# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-create-epics-and-stories. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All epics must deliver complete end-to-end user value."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "TDD is required: every story's task list MUST include explicit RED phase tasks (write failing tests) before GREEN phase tasks (implement to pass). Stories that go straight to implementation without test tasks are incomplete.",
  "Development environment story: Epic 1 or the first epic of any project must include a 'devcontainer setup' story ensuring the project has a .devcontainer/devcontainer.json, pre-commit config, and CI workflow before any implementation stories begin.",
  "Language stack is constrained: Rust (compiled/binary/performance), Python (scripts/service APIs), Bash (glue/CI), C#/.NET (enterprise), TypeScript+React (frontend SPA only). Story technical notes should reference the correct stack and package manager (uv/cargo/dotnet/npm) for this project.",
  "Acceptance criteria for every story must be testable and specific — no vague 'system works correctly' criteria. Each AC should map to at least one test.",
  "Secrets infrastructure story: Epic 1 must include a 'secrets and CI infrastructure' story that covers: (1) create the project 1Password vault named after the project in kebab-case; (2) commit .env.template with op://project-name/ URIs for all known secrets; (3) add .env to .gitignore; (4) install op CLI in devcontainer; (5) add gitleaks to .pre-commit-config.yaml; (6) stub CI workflow with '# TODO(1password): create service account and set OP_SERVICE_ACCOUNT_TOKEN' marker. This story must be sequenced before any story that consumes secrets.",
]

# Scalar: executed when the workflow reaches Step 4 (Final Validation) and the
# user confirms [C] Complete — after the epics.md is saved and bmad-help is invoked.
# Override wins. Leave empty for no custom post-completion behavior.

on_complete = ""
