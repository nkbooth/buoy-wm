version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # The wayland-* crates track the protocol bindings this WM is built on;
    # they are worth reviewing individually rather than batching.
    groups:
      serde:
        patterns: ["serde", "serde_json", "toml"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
