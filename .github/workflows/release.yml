#
# Builds the release tarball, one RPM per supported Fedora release and
# one .deb per supported Ubuntu release on a `v*` tag and attaches them,
# the vendored-crates tarball and their checksums to the GitHub release
# under one build-provenance attestation, with the tag's CHANGELOG.md
# entry as the release notes.
# The runner is only the host (ADR-015); every build runs in a container
# this file pins. Three jobs: `build` makes the tarball in a
# `ubuntu:26.04` container with a pinned rustup toolchain, cuts the notes
# and stages the packages' two sources; `packages` is one leg per README
# tier-1 release, each in that release's own container with its own
# toolchain (ADR-011, ADR-014) — the Fedora legs build the RPM, the
# Ubuntu legs the .deb, from the same two sources; and `publish`
# attests and uploads. The write permissions live on `publish` alone,
# which runs `gh` and the attest action and nothing from the tree. See
# docs/PACKAGING.md for how this feeds the Homebrew tap and the COPR RPM.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

# A tag push and a `workflow_dispatch` of the same tag could otherwise
# both find no release in `gh release view` and race `gh release
# create` (deferred from Story 4.7's review). A running run is never
# cancelled, because a cancelled `publish` leaves a half-uploaded
# release; GitHub keeps one pending run per group, so a third trigger
# replaces the queued one, which has not started.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-gnu
  # The one place the release tag is read from an expression. Every
  # step below uses "$TAG", never `${{ }}` inside a `run:` block: GitHub
  # expands `${{ }}` textually before bash parses the script, so a value
  # containing a double quote would close the assignment and run the
  # remainder as shell — including in the job that holds
  # `contents: write`, `id-token: write` and `attestations: write` and
  # mints the build-provenance attestations users are told to trust.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    # The container, not the runner, sets the glibc floor these binaries
    # impose on users: glibc is forward- but not backward-compatible.
    # `ubuntu:26.04` is the oldest glibc of the README's tier-1 releases
    # (2.43, tied with `fedora:44`); the Ubuntu LTS is chosen because it
    # outlives Fedora 44, so the floor does not move when 44 leaves the
    # table (ADR-015). tests/release-workflow.sh holds this image to the
    # table's LTS row.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: docker.io/library/ubuntu:26.04
    defaults:
      run:
        # A container job's default shell is `sh`.
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # First, before the tag is used as a ref, a filename or a shell word.
      # The grammar lives in scripts/release-version.sh, which ci.yml tests
      # on every push and which is not checked out yet, so this only
      # refuses text that is not even tag-shaped. `workflow_dispatch` input
      # is arbitrary text; the `v*` filter on tag pushes is not a version
      # check.
      - name: Refuse a tag that is not tag-shaped
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.-]+$ ]]; then
            echo "::error::tag '$TAG' is not tag-shaped"
            exit 1
          fi

      # The image runs as root and has no sudo. git so actions/checkout
      # clones rather than falling back to the REST download, which
      # leaves no .git for `git rev-parse`, `git log` and `git archive`;
      # curl and ca-certificates for the rust-toolchain action, which
      # installs rustup with `curl … https://sh.rustup.rs | sh` when it
      # is absent; gcc and libc6-dev as the linker.
      - name: Install the build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates gcc libc6-dev libwayland-dev pkg-config

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Nothing in this job needs a git credential, least of all the
          # third-party build scripts cargo runs; `gh` in `publish`
          # authenticates with GH_TOKEN.
          persist-credentials: false

      # actions/checkout trusts the workspace only in a temporary global
      # config that it removes after its own step
      # (src/git-source-provider.ts: configureTempGlobalConfig …
      # removeGlobalConfig). The workspace belongs to the runner's user
      # and this container runs as root, so every later git call would
      # die with "detected dubious ownership".
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # vX.Y.Z or vX.Y.Z-rc.N and nothing else (ADR-012). Prints the Cargo,
      # RPM, Debian and formula forms into the log.
      - name: Validate the tag
        run: scripts/release-version.sh "$TAG"

      # A tag whose version disagrees with a manifest produces a release
      # that installs as a different version than it claims to be. The
      # script is the one grammar and the one compare: it checks every
      # manifest and reports every mismatch, and ci.yml runs it on every
      # push with the tag derived from Cargo.toml, so this step only fails
      # on a tag that disagrees with a tree that agrees with itself. The
      # values are extracted with sed, never `eval`. `$GITHUB_ENV` is per
      # job, so the values the other jobs need also go to `$GITHUB_OUTPUT`,
      # with the commit this checkout resolved the tag to: `packages`
      # builds that commit, not whatever the tag names by the time it
      # starts.
      - name: Check tag matches every packaged version
        id: version
        run: |
          scripts/release-version.sh --check "$TAG"
          mapping="$(scripts/release-version.sh "$TAG")"
          version="$(sed -n 's/^cargo=//p' <<<"$mapping")"
          prerelease="$(sed -n 's/^prerelease=//p' <<<"$mapping")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The release page is the first thing a visitor to the tag reads.
      # GitHub's generated notes list the pull requests merged since the
      # previous tag; this repository merges none and the first tag has no
      # previous one, so they would be a title over a bare "Full Changelog"
      # link. The CHANGELOG.md entry for the tag is cut here instead, in
      # the job that reads the tree, so `publish` keeps running nothing
      # from it — and a tag with no entry fails here in seconds, before
      # any build, the way a half-bumped tree does in the step above.
      - name: Write the release notes
        run: |
          mkdir -p release-notes
          scripts/release-notes.sh "$TAG" > release-notes/release-notes.md

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # A version, not `stable`: the tarball and the vendored crates
          # are what the attestation names, and `stable` moves with every
          # Rust release, so a re-run of a tag months later could
          # `--clobber` an asset with a different digest. 1.99.1 is what
          # `stable` resolved to for rc.1 and rc.2, so the pin changed
          # nothing that shipped. It moves by a deliberate commit, never
          # by Dependabot, and it is not the floor: `rust-version` in
          # Cargo.toml is what distribution builds meet (PACKAGING.md
          # "Toolchain floor").
          toolchain: 1.99.1

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --release --locked

      # The tarball is self-contained: the same install.sh the repo ships
      # (it detects binaries beside itself), the docs a new user needs, and
      # the licence texts RPL 1.5 §6.4(a) requires to travel with it.
      - name: Stage tarball
        run: |
          stage="buoy-wm-${VERSION}-${TARGET}"
          mkdir -p "dist/$stage"
          cp target/release/buoy-wm target/release/buoy-tag-picker target/release/buoy-status-bar "dist/$stage/"
          cp scripts/install.sh "dist/$stage/"
          cp README.md LICENSE.md NOTICE.md "dist/$stage/"
          cp docs/config.example.toml "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          (cd dist && sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256")

      # The spec's %build runs cargo --offline, so the crates arrive as
      # Source1, the vendored-crates tarball: built here, once, with the
      # same Cargo.lock the tarball was built from, and published beside
      # the tarball so a packager can rebuild without the network. The
      # name is %{name}-%{upstream_version}-vendor.tar.gz with the tag's
      # hyphen (the spec's Source1). `cargo vendor` prints a config
      # snippet for a local .cargo/config.toml; the spec's %prep writes
      # its own, so stdout is dropped. The tarball is reproducible per
      # tag — sorted names, no owners, the commit date as every mtime,
      # `gzip -n` for no timestamp in the gzip header — so two runs of one
      # tag give one digest and the attestation is comparable.
      - name: Vendor the crates
        run: |
          cargo vendor --locked --versioned-dirs vendor >/dev/null
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          vendor="buoy-wm-${VERSION}-vendor.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -I 'gzip -n' -cf "dist/$vendor" vendor
          (cd dist && sha256sum "$vendor" > "$vendor.sha256")

      # Source0 for the packages is an archive of the tree this job just
      # validated and tested, with the prefix %autosetup expects — the same
      # prefix GitHub's own tag archive uses, so the spec's Source0 URL
      # serves a packager who fetches it by hand. Building from the
      # checkout rather than downloading GitHub's archive keeps the job
      # offline-capable and off the race with archive generation on a
      # fresh tag (readiness report M-2(b)). These two files are every
      # `packages` leg's input and are never published: GitHub serves the
      # tag archive itself and the vendor tarball is already in `dist`.
      - name: Stage the package sources
        run: |
          mkdir -p sources
          git archive --format=tar.gz --prefix="buoy-wm-${VERSION}/" -o "sources/buoy-wm-${VERSION}.tar.gz" HEAD
          cp "dist/buoy-wm-${VERSION}-vendor.tar.gz" sources/

      # Relays between jobs, not the durable copy: the release is. Seven
      # days is enough to download what `build` and `packages` made when
      # `publish` fails. The staging directory under dist/ is not an
      # asset, hence the two patterns rather than `dist/*`. Artifacts
      # belong to the workflow run, not the attempt, and v4+ refuses a
      # name that already exists; `overwrite` is what lets a re-run of
      # this job after a transient failure replace the earlier attempt's
      # relay instead of failing on it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # Every `packages` leg reads this relay; it is never published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # The notes are their own relay, never under dist/: `publish`
      # uploads everything in dist/ as an asset.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  packages:
    needs: build
    # The runner is only the host (ADR-015); each leg builds in its
    # release's container with that release's own toolchain (ADR-014).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        # A container job's default shell is `sh`.
        shell: bash
    strategy:
      # One run names every failing target; any failed leg still skips
      # `publish`, so a failing target blocks the release.
      fail-fast: false
      # The README's Supported platforms tier-1 rows, one leg each;
      # tests/release-workflow.sh holds this list to them. Images are
      # pinned by tag, not digest, on purpose: the point of a
      # distribution build is the distribution's current packages,
      # Dependabot does not bump `container.image`, and zizmor's
      # unpinned-images audit raises only a pedantic finding for a tag.
      # `job.container` cannot change per step, so each step chooses
      # its family with `if:`.
      matrix:
        include:
          - target: fedora-44
            image: registry.fedoraproject.org/fedora:44
          - target: fedora-45
            image: registry.fedoraproject.org/fedora:45
          - target: ubuntu-26.04
            image: docker.io/library/ubuntu:26.04
          - target: ubuntu-26.10
            image: docker.io/library/ubuntu:26.10
    steps:
      # git so actions/checkout clones rather than falling back to the
      # REST download; dnf5-plugins is the package that carries `builddep`
      # on Fedora 44 (45 has it in the image); rpm-build pulls tar, gzip,
      # zstd, patch, debugedit, elfutils and binutils itself.
      - name: Install the build tools (Fedora)
        if: startsWith(matrix.target, 'fedora-')
        run: dnf -y install git-core rpm-build dnf5-plugins

      # The commit `build` validated and archived as Source0, not the tag
      # name resolved a second time: a tag moved between the two jobs
      # would otherwise put the packaging and the build script from one
      # commit beside sources from another under one attestation. Both
      # families read the tree: the Fedora legs for the spec and
      # build-rpm.sh, the Ubuntu legs for packaging/deb and build-deb.sh.
      # The Ubuntu images have no git, so the action falls back to its
      # REST download; that leaves no .git, and no Ubuntu step runs git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      # debian/control's Build-Depends is the one list of the Ubuntu
      # legs' build dependencies, as the spec's BuildRequires is for
      # Fedora, so this job cannot drift from it. `build-dep` on a
      # directory needs no deb-src and installs build-essential itself.
      # lintian checks the package below. The image runs as root and has
      # no sudo.
      - name: Install the build tools (Ubuntu)
        if: startsWith(matrix.target, 'ubuntu-')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get build-dep -y ./packaging/deb
          apt-get install -y --no-install-recommends lintian

      # The spec's BuildRequires is the one list of build dependencies
      # (cargo, rust, gcc, wayland-devel, systemd-rpm-macros); read from
      # the file that declares them so this job cannot drift from it.
      - name: Install the spec's BuildRequires
        if: startsWith(matrix.target, 'fedora-')
        run: dnf -y builddep packaging/rpm/buoy-wm.spec

      # Both families read the same two sources.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: sources

      # A full `rpmbuild -bb` — %build and %check are the build and the
      # tests with Fedora's toolchain; no cargo runs outside rpmbuild. The
      # script publishes the one binary package under the name GitHub will
      # serve (see its header for the `~` rewrite) with its checksum.
      - name: Build the RPM
        if: startsWith(matrix.target, 'fedora-')
        run: scripts/build-rpm.sh sources dist

      # `dpkg-buildpackage -b` with debian/rules' build and tests on
      # Ubuntu's own cargo and rustc, offline. The script publishes the
      # one binary package under a name carrying the release label (two
      # legs build the same version; see its header) with its checksum.
      - name: Build the .deb
        if: startsWith(matrix.target, 'ubuntu-')
        run: scripts/build-deb.sh sources dist

      # The .deb and not the .changes: the changes file's `Distribution:
      # unstable` is an error under Ubuntu's lintian profile and is not
      # shipped. Warnings (no-manual-page until the man pages exist,
      # initial-upload-closes-no-bugs) print but do not fail.
      - name: Lint the .deb
        if: startsWith(matrix.target, 'ubuntu-')
        run: lintian --fail-on error --no-tag-display-limit dist/*.deb

      # One upload for both families. `overwrite` for the same re-run
      # reason as `build`'s relays.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [build, packages]
    runs-on: ubuntu-24.04
    permissions:
      # `gh release create` / `upload`.
      contents: write
      # The attest action signs with the job's OIDC identity ...
      id-token: write
      # ... and stores the attestation on the repository.
      attestations: write
    env:
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      # No checkout in this job, so `gh` cannot infer the repository from
      # a remote.
      GH_REPO: ${{ github.repository }}
    steps:
      # Every artifact lands flat in dist/: upload-artifact stores files
      # relative to the least common ancestor of the matched paths, and
      # `merge-multiple` puts every leg's package beside the tarballs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      # One attestation naming the tarball, the vendor tarball, each RPM
      # and each .deb; the .sha256 files are not subjects.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*)
          # Idempotent so a re-run after a transient failure replaces the
          # assets instead of erroring on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            # The notes are set at creation only: the branch above completes
            # the assets of an existing release and never rewrites the notes.
            flags=(--title "$TAG" --notes-file release-notes/release-notes.md)
            # An rc.N tag is a pre-release on GitHub too (ADR-012, Story 4.9).
            if [[ "$PRERELEASE" == yes ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" "${assets[@]}"
          fi
