#
# Builds the release tarball on a `v*` tag. See docs/PACKAGING.md for how
# this feeds the Homebrew tap and the COPR RPM.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    # Deliberately NOT ubuntu-latest. glibc is forward- but not
    # backward-compatible, so the oldest available runner sets the lowest
    # glibc floor these binaries impose on users. 22.04 is glibc 2.35.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The one place the release tag is read from an expression. Every
      # step below uses "$TAG", never `${{ }}` inside a `run:` block:
      # GitHub expands `${{ }}` textually before bash parses the script, so
      # a value containing a double quote would close the assignment and
      # run the remainder as shell — in the one job that holds
      # `contents: write`, `id-token: write` and `attestations: write` and
      # mints the build-provenance attestations users are told to trust.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # First, before the tag is used as a ref, a filename or a shell word.
      # The grammar lives in scripts/release-version.sh, which ci.yml tests
      # on every push and which is not checked out yet, so this only
      # refuses text that is not even tag-shaped. `workflow_dispatch` input
      # is arbitrary text; the `v*` filter on tag pushes is not a version
      # check.
      - name: Refuse a tag that is not tag-shaped
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.-]+$ ]]; then
            echo "::error::tag '$TAG' is not tag-shaped"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # `gh` below authenticates with GH_TOKEN, not with the git
          # credential this would otherwise leave in .git/config for the
          # whole job — including for third-party build scripts.
          persist-credentials: false

      # vX.Y.Z or vX.Y.Z-rc.N and nothing else (ADR-012). Prints the Cargo,
      # RPM, Debian and formula forms into the log.
      - name: Validate the tag
        run: scripts/release-version.sh "$TAG"

      # A tag whose version disagrees with a manifest produces a release
      # that installs as a different version than it claims to be. The
      # script is the one grammar and the one compare: it checks every
      # manifest and reports every mismatch, and ci.yml runs it on every
      # push with the tag derived from Cargo.toml, so this step only fails
      # on a tag that disagrees with a tree that agrees with itself. The
      # values are extracted with sed, never `eval`: this job holds
      # `contents: write` and `id-token: write`.
      - name: Check tag matches every packaged version
        run: |
          scripts/release-version.sh --check "$TAG"
          mapping="$(scripts/release-version.sh "$TAG")"
          echo "VERSION=$(sed -n 's/^cargo=//p' <<<"$mapping")" >> "$GITHUB_ENV"
          echo "PRERELEASE=$(sed -n 's/^prerelease=//p' <<<"$mapping")" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: ./.github/actions/setup-build-deps

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --release --locked

      # The tarball is self-contained: the same install.sh the repo ships
      # (it detects binaries beside itself), the docs a new user needs, and
      # the licence texts RPL 1.5 §6.4(a) requires to travel with it.
      - name: Stage tarball
        run: |
          stage="buoy-wm-${VERSION}-${TARGET}"
          mkdir -p "dist/$stage"
          cp target/release/buoy-wm target/release/buoy-tag-picker target/release/buoy-status-bar "dist/$stage/"
          cp scripts/install.sh "dist/$stage/"
          cp README.md LICENSE.md NOTICE.md "dist/$stage/"
          cp docs/config.example.toml "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          (cd dist && sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256")
          echo "ARCHIVE=dist/$stage.tar.gz" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent so a re-run after a transient failure replaces the
          # assets instead of erroring on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$ARCHIVE" "$ARCHIVE.sha256"
          else
            flags=(--title "$TAG" --generate-notes)
            # An rc.N tag is a pre-release on GitHub too (ADR-012, Story 4.9).
            if [[ "$PRERELEASE" == yes ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" "$ARCHIVE" "$ARCHIVE.sha256"
          fi
