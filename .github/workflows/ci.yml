#
# Story 1.1: cargo build + cargo test on push. Verified locally via `act`
# inside the devcontainer (no GitHub remote exists for this repo yet).
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Required to link wayland-client/wayland-backend (wm/Cargo.toml deps).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev pkg-config

      # Story 2.2: workspace-wide, from the repo root, so both `wm` and
      # `tag-picker` build/test in one pass rather than needing a
      # per-member step each.
      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace
