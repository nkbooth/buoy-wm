#
# Gates every push: format, lint, build, test. `--locked` throughout, so a
# Cargo.lock that disagrees with the manifests fails here rather than
# resolving to something nobody tested.
name: CI

on:
  push:
  pull_request:

# Every job here only reads the repository. Without this block they inherit
# the repository-default GITHUB_TOKEN scope (write-all under older
# settings) while running `cargo build`/`test` over third-party crates and
# their build scripts. `release.yml` already scopes itself this way.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI only; a local `cargo build` stays quiet enough
  # to work in.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA with the
      # version in a trailing comment: a mutable ref (and `@stable`, a
      # branch, most of all) means what runs in CI can change with no
      # commit to this repo. The `github-actions` Dependabot entry keeps
      # these pins moving.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so leaving the token in
          # .git/config for later steps only widens what a compromised
          # dependency's build script can reach.
          persist-credentials: false

      # Pinned to a SHA, so the toolchain has to be named explicitly —
      # `@stable` used to carry that meaning in the ref itself.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          # `llvm-tools-preview` is what `cargo llvm-cov` reads the raw
          # profiles with. cargo-llvm-cov can `rustup component add` it
          # itself, but naming it here keeps the toolchain this job needs
          # declared in one place rather than acquired as a side effect.
          components: rustfmt, clippy, llvm-tools-preview

      - uses: ./.github/actions/setup-build-deps

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Formatting first: it needs no dependencies and fails in seconds.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # Nothing in this pipeline would have flagged wm/src/main.rs sliding
      # to 2.55% line coverage (audit finding T-06), so the whole-workspace
      # number is printed on every run.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --locked --summary-only

      # The floor, and deliberately not on that whole-workspace number: the
      # composition roots — Wayland `Dispatch` glue, the proxy-carrying
      # records, the poll loop, the process's one exit — cannot be reached
      # from a test at all, so a workspace-wide floor set low enough to
      # accommodate them would gate nothing, while one set high enough to
      # be meaningful would fail on code that is deliberately covered
      # across a process boundary instead (audit finding T-01 phase 4). So
      # the floor covers everything *below* those roots, which is where the
      # decisions live and where the test seam is supposed to hold: 97.4%
      # at the time this was last measured, gated at 95% so an honest
      # refactor has room and a slide does not.
      #
      # The exempt files are named one by one rather than by directory
      # (`wm/src/compositor/` would be shorter). A new module under that
      # directory then lands *inside* the gate by default and has to earn
      # its way out by being named here, which is the right way round: the
      # reason `drag.rs` is not on this list is that pulling the drag
      # arithmetic away from the live proxies took it to 100%, and a
      # directory-wide exemption would have hidden that.
      - name: cargo llvm-cov (floor below the composition roots)
        run: >-
          cargo llvm-cov --workspace --locked --summary-only
          --ignore-filename-regex 'src/main\.rs$|wm/src/compositor/(child|dispatch|launch|libinput|manager|report|river|seat|window|wire)\.rs$'
          --fail-under-lines 95

      # Enforces [workspace.lints.rustdoc]: a backticked identifier in a
      # doc comment is a checked reference, so a rename cannot leave the
      # comments pointing at something that no longer exists (audit finding
      # J-07). `--document-private-items` because almost nothing in these
      # three binaries is `pub`, so the default would check nearly none of
      # it.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items --locked

  # Separate job: the MSRV declared in [workspace.package] is a promise to
  # anyone packaging this, and an accidental use of a newer feature would
  # otherwise only surface in a distro build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read the floor out of the manifest rather than hardcoding it here.
      # This job exists specifically to guard the manifest's MSRV promise,
      # so a pinned duplicate meant bumping Cargo.toml alone left CI
      # silently testing the old floor while the manifest claimed the new
      # one — a check that could not detect the thing it exists to detect.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: ./.github/actions/setup-build-deps
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked

  # `--locked` guarantees a reproducible build and, in exactly the same
  # breath, guarantees a pinned version with a published advisory against
  # it stays pinned and silent. Nothing else in this repo fails a build on
  # an advisory; this job does. See deny.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Static analysis for the things `cargo` cannot see: the workflows
  # themselves, the install script users are told to pipe a tarball into,
  # and the repository's history.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the working tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install analysers
        run: |
          # pipx, not `pip install --user`: the runner's Python is
          # externally managed (PEP 668) and refuses the latter.
          pipx install 'zizmor==1.29.0'
          pipx install 'pre-commit==4.6.2'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      # `--offline`: no online audits, so this needs no token and cannot
      # be made to fail by a rate limit.
      - name: zizmor
        run: zizmor --offline .github/workflows .github/actions

      - name: shellcheck
        run: shellcheck scripts/install.sh .devcontainer/post-create.sh

      # Runs the same pinned gitleaks revision the pre-commit config uses,
      # so there is one version of this check rather than two that drift.
      - name: gitleaks
        run: pre-commit run --all-files gitleaks
