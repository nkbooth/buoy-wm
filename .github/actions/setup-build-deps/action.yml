#
# One copy of the system-dependency install that three CI/release jobs need.
# libwayland-dev provides the headers and the .pc file that
# wayland-client/wayland-backend link against at build time; at run time
# only libwayland-client.so.0 is needed, which every Wayland system has.
name: Set up build dependencies
description: Installs the system packages the Wayland crates link against.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwayland-dev pkg-config
